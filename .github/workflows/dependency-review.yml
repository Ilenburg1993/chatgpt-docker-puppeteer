name: Dependency Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  issues: write
  pull-requests: write
  security-events: write
  statuses: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  dependabot-installability:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Verify lockfile installability
        run: |
          rm -rf node_modules
          npm ci --prefer-online --ignore-scripts --no-audit --no-fund

  dependabot-triage:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Label and summarize PR
        uses: actions/github-script@v9
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- dependabot-triage -->';
            const labels = new Set(['dependencies', 'dependabot']);
            const updateType = process.env.UPDATE_TYPE || 'unknown';
            const dependencyType = process.env.DEPENDENCY_TYPE || 'unknown';
            const dependencyNames = (process.env.DEPENDENCY_NAMES || '')
              .split(',')
              .map((value) => value.trim())
              .filter(Boolean);

            if (updateType.includes('semver-major')) labels.add('deps:major');
            else if (updateType.includes('semver-minor')) labels.add('deps:minor');
            else if (updateType.includes('semver-patch')) labels.add('deps:patch');
            else labels.add('deps:manual-review');

            if (dependencyType === 'direct:production') labels.add('deps:runtime');
            else if (dependencyType === 'direct:development') labels.add('deps:dev');
            else labels.add('deps:transitive-or-mixed');

            const body = [
              marker,
              '## Dependabot Triage',
              '',
              `- update_type: ${updateType}`,
              `- dependency_type: ${dependencyType}`,
              `- dependencies: ${dependencyNames.length > 0 ? dependencyNames.join(', ') : 'n/a'}`,
              '- required checks: dependency-review, dependabot-installability, security',
              '- merge policy: patch/minor can follow the normal fast-path after green checks; major stays manual.',
            ].join('\n');
            const isReadonlyIntegrationError = (error) =>
              error?.status === 403 &&
              error?.response?.data?.message === 'Resource not accessible by integration';

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [...labels],
              });

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });

              const existing = comments.find((comment) =>
                comment.user?.type === 'Bot' && typeof comment.body === 'string' && comment.body.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (error) {
              if (!isReadonlyIntegrationError(error)) {
                throw error;
              }

              core.warning(
                'Dependabot triage token is read-only in this run; skipping labels/comments and writing step summary instead.'
              );
              await core.summary
                .addHeading('Dependabot Triage (read-only token fallback)')
                .addRaw(body, true)
                .write();
            }
