name: Fix localhost bindings

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply changes (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  fix-bindings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Make scripts executable
        run: |
          chmod +x ./scripts/fix-bindings.js || true
          chmod +x ./scripts/check-all-bindings.sh || true

      - name: Run codemod (apply)
        run: |
          APPLY_INPUT="${{ github.event.inputs.apply }}"
          if [ -z "$APPLY_INPUT" ]; then
            APPLY_INPUT="true"
          fi
          echo "apply=$APPLY_INPUT"
          if [ "$APPLY_INPUT" = "true" ]; then
            node ./scripts/fix-bindings.js ./src --apply
          else
            node ./scripts/fix-bindings.js ./src
          fi

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: fix-bindings-diagnostics
          path: |
            diagnostics/fix-bindings-report.json
            diagnostics/bindings_report.txt
          if-no-files-found: ignore

      - name: Commit and push changes
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: apply fix-bindings codemod"
            # push using token
            git push "https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:${{ github.ref_name }}
          fi
