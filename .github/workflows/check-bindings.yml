name: Check Bindings

on:
    push:
        branches: [main]
    pull_request:

jobs:
    bindings-check:
        name: Bindings static + runtime check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies (if any)
              run: |
                  if [ -f package.json ]; then npm ci; fi

            - name: Run bindings check
              env:
                  CHECK_PORTS: 3000,3001,3002,3008,9100,9224
              run: |
                  chmod +x ./scripts/check-all-bindings.sh || true
                  ./scripts/check-all-bindings.sh
