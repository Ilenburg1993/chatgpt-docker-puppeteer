name: Audit Nightly

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit mode to run"
        required: false
        default: standard
        type: choice
        options:
          - standard
          - full

concurrency:
  group: audit-nightly-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && (inputs.mode || 'standard') || 'standard' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-nightly:
    name: Automated audit nightly (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Prepare npm environment
        run: |
          mkdir -p "$HOME/.npm"
          rm -rf node_modules
          npm cache verify || npm cache clean --force

      - name: Install dependencies (with retry)
        run: |
          for attempt in 1 2; do
            echo "npm ci attempt $attempt"
            if npm ci --prefer-online --no-audit --no-fund; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Retrying npm ci after cache cleanup..."
              rm -rf node_modules
              npm cache clean --force
            fi
          done
          exit 1

      - name: Select audit mode
        id: select_mode
        run: |
          MODE="standard"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "full" ]; then
            MODE="full"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run audit nightly (standard, artifact mode)
        if: steps.select_mode.outputs.mode == 'standard'
        run: |
          npm run audit:preflight
          rc=0
          timeout --signal=INT --kill-after=30s 40m npm run audit:nightly -- --json --output-dir artifacts/audit || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi
          if [ "$rc" -eq 124 ]; then
            echo "Audit nightly standard hit enforced timeout after 40 minutes." >&2
          fi

      - name: Run audit nightly (full, manual artifact mode)
        if: steps.select_mode.outputs.mode == 'full'
        run: |
          npm run audit:preflight
          rc=0
          timeout --signal=INT --kill-after=30s 55m npm run audit:nightly:full -- --json --publish-master false --publish-snapshot false --output-dir artifacts/audit --progress false --eta false || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi
          if [ "$rc" -eq 124 ]; then
            echo "Audit nightly full hit enforced timeout after 55 minutes." >&2
          fi

      - name: Build nightly audit summary
        if: always()
        run: |
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            const dir = "artifacts/audit";
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => f.endsWith(".json")) : [];
            if (files.length === 0) {
              fs.mkdirSync(dir, { recursive: true });
              fs.writeFileSync("artifacts/audit/nightly-summary.md", "## Audit Nightly\n\nNo audit JSON artifact was generated.\n");
              process.exit(0);
            }
            files.sort();
            const latest = files[files.length - 1];
            const payload = JSON.parse(fs.readFileSync(path.join(dir, latest), "utf8"));
            const report = payload?.report || payload;
            const lines = [
              "## Audit Nightly",
              "",
              `- mode: ${process.env.AUDIT_MODE || "standard"}`,
              `- run_id: ${report?.run_id || "n/a"}`,
              `- findings: ${report?.summary?.total_findings ?? 0}`,
              `- primary: ${report?.summary?.total_primary ?? 0} | backlog: ${report?.summary?.total_backlog ?? 0}`,
              `- partial: ${report?.summary?.partial ?? false}`,
              `- semantic_preflight_ok: ${report?.semantic_preflight?.ok ?? false}`,
              `- shadow_would_block: ${report?.shadow_gate?.would_block ?? false}`
            ];
            fs.writeFileSync("artifacts/audit/nightly-summary.md", `${lines.join("\\n")}\\n`);
          '
          if [ -f artifacts/audit/nightly-summary.md ]; then
            cat artifacts/audit/nightly-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          AUDIT_MODE: ${{ steps.select_mode.outputs.mode }}

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audit-nightly-${{ steps.select_mode.outputs.mode }}-${{ github.run_id }}
          path: artifacts/audit
          if-no-files-found: warn
          retention-days: 14
