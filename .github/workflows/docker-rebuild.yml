name: Docker Rebuild

# Workflow for building the DevContainer image, linting Dockerfile and
# scripts, and running a healthcheck.

on:
  workflow_dispatch:
  push:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/docker-rebuild.yml"
      - "scripts/check-devcontainer-sync.sh"
      - "scripts/ci/**"
  schedule:
    # run nightly at 03:50 UTC
    - cron: "50 3 * * *"

permissions:
  contents: read
  actions: read
  checks: write
  issues: write
  pull-requests: write
  security-events: write
  statuses: write

concurrency:
  group: docker-rebuild-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU for multiarch
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no cache)
        run: |
          docker buildx build --load --no-cache --tag container-test -f .devcontainer/Dockerfile .

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: .devcontainer/Dockerfile

      - name: Lint shell scripts with shellcheck
        uses: reviewdog/action-shellcheck@v1.32.0
        with:
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          shellcheck_flags: "-x"
          reporter: github-check
          filter_mode: nofilter
          fail_level: none

      - name: Run apt pin check
        run: scripts/ci/apt-pins.sh

      - name: Run container tooling smoke test
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            container-test \
            bash -lc '
              command -v node >/dev/null
              command -v devcontainer >/dev/null
              command -v gh >/dev/null
              command -v actionlint >/dev/null
              command -v hadolint >/dev/null
              command -v jsonc-validate >/dev/null
              gh --version >/dev/null
              actionlint -version >/dev/null
              hadolint --version >/dev/null
              jsonc-validate .devcontainer/devcontainer.json >/dev/null
              bash -n .devcontainer/scripts/*.sh .devcontainer/nss-gatekeeper.sh
              bash scripts/check-devcontainer-sync.sh >/tmp/devcontainer-sync.log
              tail -n 20 /tmp/devcontainer-sync.log
            '

      - name: Cleanup image
        run: docker rmi container-test || true
