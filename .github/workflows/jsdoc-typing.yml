name: JSDoc & Typing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: jsdoc-typing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typing-gate:
    name: JSDoc and typing gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-online --no-audit --no-fund

      - name: Run typing and documentation gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/typing

          run_check() {
            local name="$1"
            shift
            local log_file="artifacts/typing/${name}.log"
            local exit_file="artifacts/typing/${name}.exit"
            set +e
            "$@" >"${log_file}" 2>&1
            local exit_code=$?
            set -e
            printf '%s' "${exit_code}" > "${exit_file}"
            cat "${log_file}"
            return 0
          }

          run_check typecheck-repo npm run typecheck:repo
          run_check typecheck-strict-public npm run typecheck:strict:public
          run_check typecheck-strict-all npm run typecheck:strict:all
          run_check typecheck-declarations npm run typecheck:declarations
          run_check jsdoc-coverage npm run jsdoc:coverage:json -- --validate-schema --output-json artifacts/typing/jsdoc-report.json
          run_check jsdoc-coverage-public npm run jsdoc:coverage:public
          run_check check-schemas npm run check:schemas:typing
          run_check analyze-typing bash -lc "npm run analyze:typing:json > artifacts/typing/typing-audit.json"
          run_check analyze-typing-public bash -lc "npm run analyze:typing:json -- --scope public > artifacts/typing/typing-audit-public.json"
          run_check check-skills npm run check:skills:strict

      - name: Build summary and enforce gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const requiredSteps = [
            ['typecheck-repo', 'typecheck:repo'],
            ['typecheck-strict-public', 'typecheck:strict:public'],
            ['typecheck-strict-all', 'typecheck:strict:all'],
            ['typecheck-declarations', 'typecheck:declarations'],
            ['jsdoc-coverage', 'jsdoc:coverage:json'],
            ['jsdoc-coverage-public', 'jsdoc:coverage:public'],
            ['check-schemas', 'check:schemas:typing'],
            ['analyze-typing', 'analyze:typing'],
            ['analyze-typing-public', 'analyze:typing:public'],
            ['check-skills', 'check:skills:strict'],
          ];

          const exitCodeFor = name => {
            const file = `artifacts/typing/${name}.exit`;
            if (!fs.existsSync(file)) return 1;
            return Number(fs.readFileSync(file, 'utf8').trim() || '1');
          };

          const jsdoc = fs.existsSync('artifacts/typing/jsdoc-report.json')
            ? JSON.parse(fs.readFileSync('artifacts/typing/jsdoc-report.json', 'utf8'))
            : null;
          const typing = fs.existsSync('artifacts/typing/typing-audit.json')
            ? JSON.parse(fs.readFileSync('artifacts/typing/typing-audit.json', 'utf8'))
            : null;
          const typingPublic = fs.existsSync('artifacts/typing/typing-audit-public.json')
            ? JSON.parse(fs.readFileSync('artifacts/typing/typing-audit-public.json', 'utf8'))
            : null;

          const lines = ['## JSDoc & Typing Gate', ''];
          let hasFailure = false;

          for (const [name, label] of requiredSteps) {
            const exitCode = exitCodeFor(name);
            const ok = exitCode === 0;
            if (!ok) hasFailure = true;
            lines.push(`- ${label}: ${ok ? 'ok' : `failed (${exitCode})`}`);
          }

          lines.push('');
          if (typing?.ts_check) {
            lines.push(
              `- @ts-check coverage: src ${typing.ts_check.src.coveragePct}% | scripts ${typing.ts_check.scripts.coveragePct}% | tests ${typing.ts_check.tests.coveragePct}% | overall ${typing.ts_check.overall.coveragePct}%`
            );
            const laneCounts = Object.entries(typing.strict_lanes || {})
              .map(([lane, info]) => `${lane.replace('tsconfig.strict.', '').replace('.json', '')}: ${info.files}`)
              .join(' | ');
            lines.push(`- strict lane files: ${laneCounts || 'n/a'}`);
            lines.push(`- @ts-expect-error total: ${typing.directives?.ts_expect_error_total ?? 'n/a'}`);
          } else {
            hasFailure = true;
            lines.push('- typing audit: missing');
          }

          if (jsdoc) {
            lines.push(`- unsafe_generic_tags_total: ${jsdoc.unsafe_generic_tags_total}`);
            lines.push(`- schema validation status: ${exitCodeFor('jsdoc-coverage') === 0 ? 'ok' : 'failed'}`);
          } else {
            hasFailure = true;
            lines.push('- jsdoc report: missing');
          }

          lines.push(`- skill governance status: ${exitCodeFor('check-skills') === 0 ? 'ok' : 'failed'}`);
          lines.push(`- tsserver/schema drift status: ${exitCodeFor('check-schemas') === 0 ? 'ok' : 'failed'}`);
          lines.push('');
          lines.push('### Public Contracts');
          if (typingPublic?.public_scope) {
            lines.push(`- files: ${typingPublic.public_scope.files}`);
            lines.push(`- exports: ${typingPublic.public_scope.exports_total}`);
            lines.push(`- functions_missing_param_tags: ${typingPublic.public_scope.functions_missing_param_tags}`);
            lines.push(`- functions_missing_options_typedef: ${typingPublic.public_scope.functions_missing_options_typedef}`);
            lines.push(`- unsafe_generic_tags_total: ${typingPublic.public_scope.unsafe_generic_tags_total}`);
            lines.push(`- public_any_tags_total: ${typingPublic.public_scope.public_any_tags_total}`);
          } else {
            hasFailure = true;
            lines.push('- public contracts audit: missing');
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);

          if (hasFailure) {
            process.exit(1);
          }
          EOF

      - name: Upload typing artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jsdoc-typing-${{ github.run_id }}
          path: artifacts/typing
          if-no-files-found: warn
          retention-days: 7
