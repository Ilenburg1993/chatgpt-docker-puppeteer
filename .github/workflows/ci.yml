name: CI

# Pipeline principal: validação do ambiente e audit lite.
# Testes → unit-tests.yml | integration-tests.yml | regression-tests.yml
# Lint (ESLint + Prettier) → lint.yml | Shell lint (ShellCheck + actionlint) → shellcheck.yml
#
# Jobs:
#   validate   — validação do Node runtime, YAMLs e canário Copilot IO L2 (bloqueante)
#   audit-lite — auditoria rápida não-bloqueante (artefatos + PR comment)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  issues: write
  pull-requests: write
  security-events: write
  statuses: write

jobs:
  validate:
    name: Validation (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Prepare npm environment
        run: |
          mkdir -p "$HOME/.npm"
          npm cache verify || npm cache clean --force

      - name: Install dependencies (with retry)
        run: |
          for attempt in 1 2; do
            echo "npm ci attempt $attempt"
            if npm ci --prefer-online --no-audit --no-fund; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Retrying npm ci after cache cleanup..."
              rm -rf node_modules
              npm cache clean --force
            fi
          done
          exit 1

      - name: Validate Node runtime
        id: node_check
        run: node scripts/ci/check-node-version.mjs

      - name: Copilot IO L2 experimental canary
        id: l2_canary
        run: npm run check:copilot:io-l2-canary

      - name: Validate Copilot architecture, docs and workflow YAMLs
        id: yaml_check
        run: |
          npm run copilot:docs:check
          npm run copilot:architecture:check
          node scripts/ci/validate-workflows.mjs

      - name: Build step summary
        if: always()
        env:
          NODE_OUTCOME: ${{ steps.node_check.outcome }}
          YAML_OUTCOME: ${{ steps.yaml_check.outcome }}
          L2_OUTCOME: ${{ steps.l2_canary.outcome }}
        run: |
          icon() { if [ "$1" = "success" ]; then echo "✅"; else echo "❌"; fi; }
          if [ "$NODE_OUTCOME" != "success" ] || [ "$YAML_OUTCOME" != "success" ] || [ "$L2_OUTCOME" != "success" ]; then
            ALL_OK="failure"
          else
            ALL_OK="success"
          fi
          {
            echo "## $(icon "$ALL_OK") CI — Validation (Node 24)"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| Validate Node runtime | $(icon "$NODE_OUTCOME") $NODE_OUTCOME |"
            echo "| Validate workflow YAMLs | $(icon "$YAML_OUTCOME") $YAML_OUTCOME |"
            echo "| Copilot IO L2 experimental canary | $(icon "$L2_OUTCOME") $L2_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: CI Summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          NODE_OUTCOME: ${{ steps.node_check.outcome }}
          YAML_OUTCOME: ${{ steps.yaml_check.outcome }}
          L2_OUTCOME: ${{ steps.l2_canary.outcome }}
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const nodeOk = process.env.NODE_OUTCOME === 'success';
            const yamlOk = process.env.YAML_OUTCOME === 'success';
            const l2Ok = process.env.L2_OUTCOME === 'success';
            const allOk = nodeOk && yamlOk && l2Ok;
            const icon = (ok) => ok ? '✅' : '❌';
            const marker = '<!-- ci-validate-summary -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `## ${icon(allOk)} CI — Validation (Node 24)`,
              '',
              '| Check | Status |',
              '|---|---|',
              `| Validate Node runtime | ${icon(nodeOk)} ${nodeOk ? 'passed' : 'failed'} |`,
              `| Validate workflow YAMLs | ${icon(yamlOk)} ${yamlOk ? 'passed' : 'failed'} |`,
              `| Copilot IO L2 experimental canary | ${icon(l2Ok)} ${l2Ok ? 'passed' : 'failed'} |`,
              '',
              allOk
                ? `> ✅ Validação do ambiente passou. [Ver logs](${runUrl}).`
                : `> ❌ Falhas na validação. [Ver logs completos](${runUrl}).`,
            ].join('\n');
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const existing = comments.find((c) =>
                c.user?.type === 'Bot' &&
                typeof c.body === 'string' &&
                c.body.includes(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (err) {
              core.warning(`Failed to post PR comment: ${err.message}. Results available in the workflow step summary.`);
              await core.summary.addRaw(body, true).write();
            }

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-online --no-audit --no-fund

      - name: Typecheck (node)
        run: npx tsc -p tsconfig.node.json --noEmit

  audit-lite:
    name: Audit lite (non-blocking)
    runs-on: ubuntu-latest
    needs: validate
    continue-on-error: true
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Prepare npm environment
        run: |
          mkdir -p "$HOME/.npm"
          npm cache verify || npm cache clean --force

      - name: Install dependencies (with retry)
        run: |
          for attempt in 1 2; do
            echo "npm ci attempt $attempt"
            if npm ci --prefer-online --no-audit --no-fund; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Retrying npm ci after cache cleanup..."
              rm -rf node_modules
              npm cache clean --force
            fi
          done
          exit 1

      - name: Prepare artifact directories
        run: mkdir -p artifacts/audit

      - name: Run audit quick (JSON artifact)
        id: run_audit_quick
        continue-on-error: true
        run: |
          npm run audit:preflight
          npm run audit:quick -- --json --publish-master false --publish-snapshot false --output-dir artifacts/audit --focus bug-first --contracts-mode hybrid --enforce-level warn --proposal-depth standard --chaos-profile off --cloud-fallback off --log-format jsonl --progress false --eta false --shadow-gate true

      - name: Build audit summary
        id: audit_summary
        if: always()
        run: |
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            const dir = "artifacts/audit";
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => f.endsWith(".json")) : [];
            if (files.length === 0) {
              fs.writeFileSync("artifacts/audit/audit-summary.md", "## Audit Lite\n\nNo JSON artifact was generated.\n");
              process.exit(0);
            }
            files.sort();
            const latest = files[files.length - 1];
            const payload = JSON.parse(fs.readFileSync(path.join(dir, latest), "utf8"));
            const report = payload?.report || payload;
            const summary = report?.summary || {};
            const telemetry = report?.telemetry || {};
            const md = [
              "## Audit Lite (non-blocking)",
              "",
              `- run_id: ${report?.run_id || "n/a"}`,
              `- profile: ${report?.profile || "n/a"}`,
              `- findings: ${summary?.total_findings ?? 0}`,
              `- findings(primary): ${summary?.total_primary ?? 0} | findings(backlog): ${summary?.total_backlog ?? 0}`,
              `- partial: ${summary?.partial ?? false}`,
              `- P0: ${summary?.by_severity?.P0 ?? 0} | P1: ${summary?.by_severity?.P1 ?? 0} | P2: ${summary?.by_severity?.P2 ?? 0} | P3: ${summary?.by_severity?.P3 ?? 0}`,
              `- MCP: ${telemetry?.mcp?.ok ? "OK" : "FAIL"} | RAG: ${telemetry?.rag?.ok ? "OK" : "FAIL"} | LSP: ${telemetry?.lsp?.ok ? "OK" : "WARN"}`,
              `- Semantic preflight: ${report?.semantic_preflight?.ok ? "OK" : "FAIL"} | Shadow would_block: ${report?.shadow_gate?.would_block ? "YES" : "NO"}`,
              `- Audit step outcome: ${process.env.AUDIT_STEP_OUTCOME || "unknown"}`,
            ].join("\\n");
            fs.writeFileSync("artifacts/audit/audit-summary.md", `${md}\\n`);
          '
          cat artifacts/audit/audit-summary.md >> "$GITHUB_STEP_SUMMARY"
        env:
          AUDIT_STEP_OUTCOME: ${{ steps.run_audit_quick.outcome }}

      - name: Comment PR with audit summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const summaryPath = 'artifacts/audit/audit-summary.md';
            if (!fs.existsSync(summaryPath)) {
              core.info('audit-summary.md not found, skipping PR comment');
              return;
            }
            const marker = '<!-- audit-lite-summary -->';
            const body = `${marker}\n${fs.readFileSync(summaryPath, 'utf8')}`;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100
              });
              const existing = comments.find((comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body
                });
              }
            } catch (err) {
              core.warning(`Failed to post PR comment: ${err.message}. Results available in the workflow step summary.`);
              await core.summary.addRaw(body, true).write();
            }

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-lite-${{ github.run_id }}
          path: artifacts/audit
          if-no-files-found: warn
          retention-days: 7
