name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  issues: write
  pull-requests: write
  security-events: write
  statuses: write

jobs:
  validate:
    name: Lint, format and tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Prepare npm environment
        run: |
          mkdir -p "$HOME/.npm"
          npm cache verify || npm cache clean --force

      - name: Install dependencies (with retry)
        run: |
          for attempt in 1 2; do
            echo "npm ci attempt $attempt"
            if npm ci --prefer-online --no-audit --no-fund; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Retrying npm ci after cache cleanup..."
              rm -rf node_modules
              npm cache clean --force
            fi
          done
          exit 1

      - name: Validate Node runtime
        run: node scripts/ci/check-node-version.mjs

      - name: Validate workflow YAMLs
        run: node scripts/ci/validate-workflows.mjs

      - name: Lint GitHub workflows with actionlint
        uses: raven-actions/actionlint@v2.1.1

      - name: Lint shell scripts with shellcheck
        uses: reviewdog/action-shellcheck@v1.32.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          shellcheck_flags: "-x"
          reporter: github-check
          filter_mode: nofilter
          fail_level: error

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

  audit-lite:
    name: Audit lite (non-blocking)
    runs-on: ubuntu-latest
    needs: validate
    continue-on-error: true
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Prepare npm environment
        run: |
          mkdir -p "$HOME/.npm"
          npm cache verify || npm cache clean --force

      - name: Install dependencies (with retry)
        run: |
          for attempt in 1 2; do
            echo "npm ci attempt $attempt"
            if npm ci --prefer-online --no-audit --no-fund; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Retrying npm ci after cache cleanup..."
              rm -rf node_modules
              npm cache clean --force
            fi
          done
          exit 1

      - name: Prepare artifact directories
        run: mkdir -p artifacts/audit

      - name: Run audit quick (JSON artifact)
        id: run_audit_quick
        continue-on-error: true
        run: |
          npm run audit:preflight
          npm run audit:quick -- --json --publish-master false --publish-snapshot false --output-dir artifacts/audit --focus bug-first --contracts-mode hybrid --enforce-level warn --proposal-depth standard --chaos-profile off --cloud-fallback off --log-format jsonl --progress false --eta false --shadow-gate true

      - name: Build audit summary
        id: audit_summary
        if: always()
        run: |
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            const dir = "artifacts/audit";
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => f.endsWith(".json")) : [];
            if (files.length === 0) {
              fs.writeFileSync("artifacts/audit/audit-summary.md", "## Audit Lite\n\nNo JSON artifact was generated.\n");
              process.exit(0);
            }
            files.sort();
            const latest = files[files.length - 1];
            const payload = JSON.parse(fs.readFileSync(path.join(dir, latest), "utf8"));
            const report = payload?.report || payload;
            const summary = report?.summary || {};
            const telemetry = report?.telemetry || {};
            const md = [
              "## Audit Lite (non-blocking)",
              "",
              `- run_id: ${report?.run_id || "n/a"}`,
              `- profile: ${report?.profile || "n/a"}`,
              `- findings: ${summary?.total_findings ?? 0}`,
              `- findings(primary): ${summary?.total_primary ?? 0} | findings(backlog): ${summary?.total_backlog ?? 0}`,
              `- partial: ${summary?.partial ?? false}`,
              `- P0: ${summary?.by_severity?.P0 ?? 0} | P1: ${summary?.by_severity?.P1 ?? 0} | P2: ${summary?.by_severity?.P2 ?? 0} | P3: ${summary?.by_severity?.P3 ?? 0}`,
              `- MCP: ${telemetry?.mcp?.ok ? "OK" : "FAIL"} | RAG: ${telemetry?.rag?.ok ? "OK" : "FAIL"} | LSP: ${telemetry?.lsp?.ok ? "OK" : "WARN"}`,
              `- Semantic preflight: ${report?.semantic_preflight?.ok ? "OK" : "FAIL"} | Shadow would_block: ${report?.shadow_gate?.would_block ? "YES" : "NO"}`,
              `- Audit step outcome: ${process.env.AUDIT_STEP_OUTCOME || "unknown"}`,
            ].join("\\n");
            fs.writeFileSync("artifacts/audit/audit-summary.md", `${md}\\n`);
          '
          cat artifacts/audit/audit-summary.md >> "$GITHUB_STEP_SUMMARY"
        env:
          AUDIT_STEP_OUTCOME: ${{ steps.run_audit_quick.outcome }}

      - name: Comment PR with audit summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const summaryPath = 'artifacts/audit/audit-summary.md';
            if (!fs.existsSync(summaryPath)) {
              core.info('audit-summary.md not found, skipping PR comment');
              return;
            }
            const marker = '<!-- audit-lite-summary -->';
            const body = `${marker}\n${fs.readFileSync(summaryPath, 'utf8')}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              typeof comment.body === 'string' &&
              comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-lite-${{ github.run_id }}
          path: artifacts/audit
          if-no-files-found: warn
          retention-days: 7

  integration:
    name: Integration tests (Node 24)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Prepare npm environment
        run: |
          mkdir -p "$HOME/.npm"
          npm cache verify || npm cache clean --force

      - name: Install dependencies (with retry)
        run: |
          for attempt in 1 2; do
            echo "npm ci attempt $attempt"
            if npm ci --prefer-online --no-audit --no-fund; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Retrying npm ci after cache cleanup..."
              rm -rf node_modules
              npm cache clean --force
            fi
          done
          exit 1

      - name: Integration tests
        run: npm run test:integration

  regression:
    name: Regression tests (Node 24)
    runs-on: ubuntu-latest
    needs: integration
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Prepare npm environment
        run: |
          mkdir -p "$HOME/.npm"
          npm cache verify || npm cache clean --force

      - name: Install dependencies (with retry)
        run: |
          for attempt in 1 2; do
            echo "npm ci attempt $attempt"
            if npm ci --prefer-online --no-audit --no-fund; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Retrying npm ci after cache cleanup..."
              rm -rf node_modules
              npm cache clean --force
            fi
          done
          exit 1

      - name: Regression tests
        run: npm run test:regression
