name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  issues: write
  pull-requests: write
  security-events: write
  statuses: write

jobs:
  npm-audit:
    name: NPM audit (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Prepare npm environment
        run: |
          mkdir -p "$HOME/.npm"
          npm cache verify || npm cache clean --force

      - name: Install dependencies (with retry)
        run: |
          for attempt in 1 2; do
            echo "npm ci attempt $attempt"
            if npm ci --prefer-online --no-audit --no-fund; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Retrying npm ci after cache cleanup..."
              rm -rf node_modules
              npm cache clean --force
            fi
          done
          exit 1

      - name: Prepare artifact directories
        run: mkdir -p artifacts/security

      - name: NPM audit (prod only)
        run: |
          node scripts/security/npm-audit-gate.mjs \
            --omit=dev \
            --min-severity=high \
            --report-file artifacts/security/npm-audit-gate.json \
            --markdown-file artifacts/security/npm-audit-summary.md

      - name: Publish security summary
        if: always()
        run: |
          if [ -f artifacts/security/npm-audit-summary.md ]; then
            cat artifacts/security/npm-audit-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment PR with security audit results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const { readFileSync, existsSync } = require('node:fs');
            const marker = '<!-- security-npm-audit-summary -->';
            const summaryPath = 'artifacts/security/npm-audit-summary.md';
            const content = existsSync(summaryPath)
              ? readFileSync(summaryPath, 'utf8')
              : '_(npm audit summary not generated — check the workflow logs)_\n';
            const body = `${marker}\n## 🔒 Security — NPM Audit (prod)\n\n${content}`;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const existing = comments.find((c) =>
                c.user?.type === 'Bot' && c.body?.includes(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (err) {
              core.warning(`Failed to post PR comment: ${err.message}. Results available in the workflow step summary.`);
              await core.summary.addRaw(body, true).write();
            }

      - name: Upload security audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-${{ github.run_id }}
          path: artifacts/security
          if-no-files-found: warn
          retention-days: 14

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
