name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: NPM audit (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Prepare npm environment
        run: |
          mkdir -p "$HOME/.npm"
          rm -rf node_modules
          npm cache verify || npm cache clean --force

      - name: Install dependencies (with retry)
        run: |
          for attempt in 1 2; do
            echo "npm ci attempt $attempt"
            if npm ci --prefer-online --no-audit --no-fund; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Retrying npm ci after cache cleanup..."
              rm -rf node_modules
              npm cache clean --force
            fi
          done
          exit 1

      - name: NPM audit (prod only)
        run: |
          node scripts/security/npm-audit-gate.mjs \
            --omit=dev \
            --min-severity=high \
            --report-file artifacts/security/npm-audit-gate.json \
            --markdown-file artifacts/security/npm-audit-summary.md

      - name: Publish security summary
        if: always()
        run: |
          if [ -f artifacts/security/npm-audit-summary.md ]; then
            cat artifacts/security/npm-audit-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload security audit artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-audit-${{ github.run_id }}
          path: artifacts/security
          if-no-files-found: warn
          retention-days: 14

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
