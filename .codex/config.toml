# Codex project-scoped overrides (per-repo)
#
# How this is applied:
# - When running `codex` in a shell, export: `CODEX_HOME=$PWD/.codex`
# - In VS Code integrated terminal, we set `CODEX_HOME` via `.vscode/settings.json`
#
# Goal: keep good quality while reducing latency/overhead for day-to-day work.

model_reasoning_effort = "xhigh"
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "cached"
suppress_unstable_features_warning = true
model = "gpt-5.4"

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = true

[features]
collaboration_modes = true
personality = true
request_rule = true
shell_tool = true
shell_snapshot = true
shell_tool_allow_bypass = true
unified_exec = true
undo = true
use_linux_sandbox_bwrap = false
apply_patch_freeform = true
exec_policy = true
remote_compaction = true
# Intentionally omitted: remote_models (obsolete/removed; caused prior Codex issues in the container)

[request_rule]
text = """
Antes de tarefas nao triviais, priorize .github/AGENTS.md,
.github/copilot-instructions.md e .github/instructions/project-canon.instructions.md. Se a tarefa
casar com uma skill, procure-a em .github/skills antes de definir a abordagem. Preserve pt-BR,
Node.js 24+ com ESM, src/main.js como bootstrap canonico, arquitetura orientada a eventos com NERV
e a proibicao de usar puppeteer.launch() ou gerenciar browser localmente. Apos mudancas relevantes,
rode npm run lint, npm run format:check e npm run test:unit; inclua npm run test:integration quando
alterar driver, kernel ou server.
"""

[plugins."github@openai-curated"]
enabled = true
